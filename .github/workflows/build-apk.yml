name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project shell
        run: flutter create --org com.focusfamily --project-name focus_family --platforms=android app

      - name: Copy our code over the shell
        run: rsync -a --exclude='.git' --exclude='.github' --exclude='app' ./ app/

      - name: Patch Gradle and add secrets
        working-directory: app
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          python3 apply_patches.py
          printf '%s' "$GSJ" > android/app/google-services.json
          echo "$KS_B64" | base64 -d > android/focusfamily-release.jks
          {
            echo "storePassword=$KS_PASS"
            echo "keyPassword=$KS_PASS"
            echo "keyAlias=focusfamily"
            echo "storeFile=$PWD/android/focusfamily-release.jks"
          } > android/key.properties
          python3 ci_patch_signing.py

      - name: Build release APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk FocusFamily.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FocusFamily-apk
          path: app/FocusFamily.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FocusFamily v1.0.${{ github.run_number }}
          files: app/FocusFamily.apk
